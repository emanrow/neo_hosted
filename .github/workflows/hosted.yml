# The hosted edition's checks on every pull request and every push to main:
# the node:test suite, the lint, the shared manuscript parser's tests, a
# build of the Docker image Railway deploys, booted once to answer /healthz,
# and the PDF printer (print/): its suite against the runner's Chrome, then
# its own image built, booted and handed a small book.
# The owner has no local environment, so this is the only place these run
# before a merge reaches Railway.

name: Hosted edition

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    services:
      postgres:
        # the PgUserStore tests (web/test/db.test.js) run only when this URL is set
        image: postgres:16
        env:
          POSTGRES_USER: neo
          POSTGRES_PASSWORD: neo
          POSTGRES_DB: neo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U neo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEO_TEST_DATABASE_URL: postgres://neo:neo@127.0.0.1:5432/neo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the hosted edition's runtime dependencies
        run: cd web && npm ci --no-audit --no-fund
      - name: Hosted suite
        run: npm run test:web
      - name: Shared manuscript parser
        # lives beside upstream's tests and needs only JSZip from the root
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund jszip
          node --test scripts/import-parse.test.js
      - name: Lint
        run: npx --yes oxlint@1 -c .oxlintrc.json web/server.js web/lib web/public web/test print/server.js print/book.js print/hyphenate.js print/test

  image:
    name: Docker image boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image Railway deploys
        run: docker build -t neo-hosted .
      - name: Boot it and ask /healthz
        run: |
          docker run -d --name neo -p 8080:8080 -e NEO_DEV=1 -e NEO_SIGNUP=open neo-hosted
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo; echo "healthy"; exit 0; fi
            sleep 1
          done
          echo "::error::the image never answered /healthz"; docker logs neo; exit 1

  print:
    name: PDF printer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: print/package-lock.json
      - name: Install the printer's dependencies
        run: cd print && npm ci --no-audit --no-fund
      - name: The printer's suite, with the runner's Chrome
        # ubuntu-latest ships Google Chrome; the image uses Debian's chromium
        run: cd print && CHROMIUM_PATH=/usr/bin/google-chrome npm test
      - name: Build the printer's image
        run: docker build -t neo-print print
      - name: Boot it and print a book
        run: |
          docker run -d --name print -p 8081:8080 -e NEO_PRINT_SECRET=open-sesame-open neo-print
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/healthz; then echo; echo "healthy"; break; fi
            sleep 1
          done
          printf '<!DOCTYPE html><html><head><title>CI</title></head><body><section class="chapter"><h2>One</h2>%s</section></body></html>' "$(printf '<p>The lighthouse keeper counted the ships as they passed.</p>%.0s' $(seq 1 200))" > book.html
          curl -fsS -o book.pdf -D headers.txt -H 'Authorization: Bearer open-sesame-open' -H 'Content-Type: text/html' --data-binary @book.html 'http://127.0.0.1:8081/render?trim=5.5x8.5' || { docker logs print; exit 1; }
          cat headers.txt
          head -c 5 book.pdf | grep -q '%PDF-' || { echo "::error::the printer did not answer with a PDF"; docker logs print; exit 1; }
          grep -qi '^x-neo-paged: 1' headers.txt || { echo "::error::Paged.js did not lay the book out"; docker logs print; exit 1; }
          echo "printed $(wc -c < book.pdf) bytes"

  epub:
    name: EPUB export passes epubcheck
    runs-on: ubuntu-latest
    # Playwright's image has the Chromium the exporter runs in; epubcheck wants a JRE
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install the hosted edition's runtime dependencies and Playwright's driver
        # playwright-core is not a runtime dependency; the version matches the image's Chromium
        run: cd web && npm ci --no-audit --no-fund && npm i --no-save --no-audit --no-fund playwright-core@1.63.0
      - name: Install a JRE and epubcheck
        run: |
          apt-get update -q && apt-get install -y -q --no-install-recommends default-jre-headless unzip > /dev/null
          curl -fsSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          unzip -q epubcheck.zip
      - name: Export a book as EPUB through the real exporter and check it
        run: EPUBCHECK_JAR=$PWD/epubcheck-5.2.1/epubcheck.jar node web/scripts/epubcheck.e2e.js
